<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Infinite Frames — Marquee</title>
</head>

<body>
  <main id="app" class="marquee-page">
    <header class="page-header">
      <p class="eyebrow">CSS animation / 01</p>
      <h1>Infinite <em>frames.</em></h1>
      <p class="page-intro">A continuous image marquee with no start and no finish.</p>
    </header>
    <section class="showcase-panel" aria-label="Infinite scrolling image marquee">
      <div class="panel-label"><span>Image stream</span><span>9.3s / linear</span></div>
      <div class="marque-wrapper">
        <div class="marque-track">
          <img
            src="https://images.unsplash.com/photo-1788438868315-42d573e3b87f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxM3x8fGVufDB8fHx8fA%3D%3D"
            alt="Nature scene">
          <img
            src="https://images.unsplash.com/photo-1788510676262-c8e1c83082c0?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxOXx8fGVufDB8fHx8fA%3D%3D"
            alt="Nature scene">
          <img
            src="https://images.unsplash.com/photo-1788523760231-cef60878ab5c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzMnx8fGVufDB8fHx8fA%3D%3D"
            alt="Nature scene">
          <img
            src="https://images.unsplash.com/photo-1784231882360-385582da2e35?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw2N3x8fGVufDB8fHx8fA%3D%3D"
            alt="Nature scene">
          <img
            src="https://images.unsplash.com/photo-1787209221424-2e01ea79b53e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMDN8fHxlbnwwfHx8fHw%3D"
            alt="Nature scene">
        </div>
        <div class="marque-track" aria-hidden="true">
          <img
            src="https://images.unsplash.com/photo-1788438868315-42d573e3b87f?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxM3x8fGVufDB8fHx8fA%3D%3D"
            alt="">
          <img
            src="https://images.unsplash.com/photo-1788510676262-c8e1c83082c0?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxOXx8fGVufDB8fHx8fA%3D%3D"
            alt="">
          <img
            src="https://images.unsplash.com/photo-1788523760231-cef60878ab5c?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwzMnx8fGVufDB8fHx8fA%3D%3D"
            alt="">
          <img
            src="https://images.unsplash.com/photo-1784231882360-385582da2e35?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHw2N3x8fGVufDB8fHx8fA%3D%3D"
            alt="">
          <img
            src="https://images.unsplash.com/photo-1787209221424-2e01ea79b53e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMDN8fHxlbnwwfHx8fHw%3D"
            alt="">
        </div>
      </div>
      <p class="panel-note">Five photographs, duplicated for a seamless loop.</p>
    </section>
  </main>
</body>

</html>
