<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Organic Shape — SVG</title>
</head>

<body>
  <main id="app" class="svg-page">
    <header class="page-header">
      <p class="eyebrow">SVG animation / 02</p>
      <h1>Organic<br><em>shape.</em></h1>
      <p>A photo framed by an animated SVG clip path.</p>
    </header>
    <section class="blob-showcase" aria-label="Animated SVG clip path example">
      <div class="showcase-meta"><span>Morphing mask</span><span>4s / infinite</span></div>
      <svg width="0" height="0">
        <defs>
          <clipPath id="blobClip" clipPathUnits="objectBoundingBox">
            <path fill="white">
              <animate attributeName="d" dur="4s" repeatCount="indefinite"
                values="M0.5,0 C0.82,0 1,0.18 1,0.5 C1,0.82 0.82,1 0.5,1 C0.18,1 0,0.82 0,0.5 C0,0.18 0.18,0 0.5,0 Z; M0.05,0 C0.95,0.05 1,0.35 0.92,0.55 C0.85,0.9 0.65,1 0.45,0.95 C0.1,0.92 -0.02,0.65 0.05,0.42 C0.12,0.12 0.3,-0.05 0.5,0 Z; M0.5,0 C0.75,-0.05 1,0.15 0.98,0.45 C0.95,0.82 0.75,1 0.5,1 C0.22,1 0.02,0.82 0.02,0.5 C0.02,0.15 0.25,-0.02 0.5,0 Z; M0.5,0 C0.82,0 1,0.18 1,0.5 C1,0.82 0.82,1 0.5,1 C0.18,1 0,0.82 0,0.5 C0,0.18 0.18,0 0.5,0 Z" />
            </path>
          </clipPath>
        </defs>
      </svg>
      <div class="blob-frame"><img
          src="https://images.unsplash.com/photo-1788892888342-4780174db757?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyfHx8ZW58MHx8fHx8"
          style="clip-path: url(#blobClip); width: 300px" alt="Landscape within an animated organic shape"></div>
      <p class="showcase-caption">The path moves; the image stays still.</p>
    </section>
  </main>
</body>

</html>
