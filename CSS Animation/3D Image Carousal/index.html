<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Wild Orbit — 3D Carousel</title>
</head>

<body>
  <main id="app" class="carousel-page">
    <header class="page-header">
      <p class="eyebrow">CSS animation / 03</p>
      <h1>Wild <em>orbit.</em></h1>
      <p>Hover over the gallery to pause its rotation.</p>
    </header>
    <section class="carousel-panel" aria-label="Rotating three dimensional animal image carousel">
      <div class="panel-label"><span>8 frame rotation</span><span>20s / linear</span></div>
      <div class="carousal-scene">
        <div class="carousal">
          <div class="carousal-items"><img

              alt="Animal portrait"></div>

              src="https://images.unsplash.com/photo-1787684008839-46fc2734e877?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDIyfDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D"
              alt="Animal portrait"></div>
