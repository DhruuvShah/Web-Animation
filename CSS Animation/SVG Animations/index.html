<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>SVG Motion Studies</title>
</head>

<body>
    <main id="app" aria-label="SVG animation gallery">
        <header class="page-heading">
            <p class="eyebrow">Motion collection · 04</p>
            <h1>SVG motion studies</h1>
            <p class="intro">Four small experiments, all moving in their own rhythm.</p>
        </header>
        <section class="animation-grid" aria-label="SVG animation examples">
            <article class="animation-card signature-card">
                <div class="card-meta"><span>01</span><span>Path drawing</span></div>
                <div class="artwork"><svg viewBox="0 0 300 120" aria-label="Animated signature line">
                        <path class="signature" pathLength="1" d="M10,80 C60,10 120,120 180,40 S260,10 290,60"
                            fill="none" stroke="#ffff" stroke-width="4" />
                    </svg></div>
                <h2>Signature</h2>
            </article>
            <article class="animation-card ball-card">
                <div class="card-meta"><span>02</span><span>Motion path</span></div>
                <div class="artwork"><svg viewBox="0 0 400 150" aria-label="Ball moving along a curved path">
                        <path class="track" d="M10,120 C120,-20 280, 320 390, 30" fill="none" stroke-width="2" />
                        <circle class="ball" r="10" fill="#e17055" />
                    </svg></div>
                <h2>Along the curve</h2>
            </article>
            <article class="animation-card pulse-card">
                <div class="card-meta"><span>03</span><span>SVG native</span></div>
                <div class="artwork"><svg viewBox="0 0 120 120" aria-label="Pulsing circle">
                        <circle cx="60" cy="60" r="15" fill="#00b894">
                            <animate attributeName="r" values="15;30;15" dur="2s" repeatCount="indefinite" />
                        </circle>
                    </svg></div>
                <h2>Pulse</h2>
            </article>
            <article class="animation-card wave-card">
                <div class="card-meta"><span>04</span><span>Text on path</span></div>
                <div class="artwork"><svg class="wave-text" viewBox="0 0 500 60"
                        aria-label="Creative Web Developer animated along a wave">
                        <path id="curve" d="M10,40 C130,-10 370,90 490,30" fill="none" /><text font-size="24"
                            fill="#fefefe">
                            <textPath href="#curve" startOffset="0%">Creative Web Developer
                                <animate attributeName="startOffset" from="0%" to="100%" dur="8s"
                                    repeatCount="indefinite" />
                            </textPath>
                        </text>
                    </svg></div>
                <h2>Wave type</h2>
            </article>
        </section>
    </main>
</body>

</html>
